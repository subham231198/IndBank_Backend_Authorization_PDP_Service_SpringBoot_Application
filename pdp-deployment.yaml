apiVersion: apps/v1
kind: Deployment
metadata:
  name: pdp-service
  labels:
    app: pdp-service
spec:
  replicas: 5
  selector:
    matchLabels:
      app: pdp-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: pdp-service
    spec:
      containers:
        - name: pdp-service
          image: pdp-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5059
          env:
            - name: SERVER_PORT
              value: "5059"
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 5059
            initialDelaySeconds: 60
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 5059
            initialDelaySeconds: 45
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: pdp-service
  labels:
    app: pdp-service
spec:
  type: LoadBalancer
  ports:
    - port: 5059
      targetPort: 5059
      name: http
  selector:
    app: pdp-service