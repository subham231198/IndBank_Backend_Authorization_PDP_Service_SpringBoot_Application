spring:
  application:
    name: PolicyDecisionPointService

  datasource:
    url: jdbc:mysql://localhost:3306/AuthenticationDB
    username: root
    password: SM231198
    driver-class-name: com.mysql.cj.jdbc.Driver

    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000

logging:
  level:
    org.springframework.security: DEBUG
    org.springframework.security.oauth2: DEBUG
    org.springframework.web: DEBUG
    org.springframework.web.client: DEBUG
    org.apache.hc.client5.http: DEBUG

server:
  port: 5059
  tomcat:
    # Connection timeout - 2 minutes (in milliseconds)
    connection-timeout: 120000
    # Keep-alive timeout - 2 minutes
    keep-alive-timeout: 120000
    # Maximum number of keep-alive requests
    max-keep-alive-requests: 100
    # Thread pool configuration
    threads:
      max: 500
      min-spare: 10
    # Maximum connections
    max-connections: 3000
    # Accept count (backlog)
    accept-count: 100
