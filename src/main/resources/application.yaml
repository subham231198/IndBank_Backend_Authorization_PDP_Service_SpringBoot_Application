spring:
  application:
    name: PolicyDecisionPointService

  datasource:
    url: jdbc:mysql://localhost:3306/AuthenticationDB
    username: root
    password: SM231198
    driver-class-name: com.mysql.cj.jdbc.Driver

    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000

logging:
  level:
    org.springframework.security: DEBUG
    org.springframework.security.oauth2: DEBUG
    org.springframework.web: DEBUG
    org.springframework.web.client: DEBUG
    org.apache.hc.client5.http: DEBUG

server:
  port: 5059
  tomcat:
    # Prevent connection timeouts
    connection-timeout: 300000  # 5 minutes
    keep-alive-timeout: 300000  # 5 minutes
    max-keep-alive-requests: 1000
    # Thread pool to handle idle connections
    threads:
      max: 300
      min-spare: 50
    # Prevent socket timeouts
    acceptor-thread-count: 2
    max-connections: 20000
    accept-count: 200

  mvc:
    async:
      request-timeout: 300000